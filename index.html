<!Doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mamadou Jallow is a Junior Full-Stack Developer from The Gambia who builds practical web applications and is progressing from frontend toward full-stack software engineering."
    />
    <meta name="author" content="Mamadou Jallow" />
    <meta name="theme-color" content="#080b12" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          /* no storage / matchMedia: fall back to the default dark theme */
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>Mamadou Jallow - Junior Full-Stack Developer</title>
  </head>

    <div id="root" class="min-h-svh"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
